<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪人的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(180deg, #f0f7ff, #e6f2ff) url("bg.png") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #f0f7ff;
            color: #333;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 全局雪花动画容器 */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    /* 背景图100%完全显示，不重复、占满全屏、滚动时固定不动 */
    background: #f0f7ff url("bg.png") no-repeat center center fixed;
    background-size: cover;
        }

        /* 标题框样式 */
        header {
            background: rgba(255, 255, 255, 0.85);
            padding: 26px;
            text-align: center;
            margin-bottom: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        /* 标题框内部雪花 */
        header .snow-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        header h1 {
            font-size: 28px;
            color: #222;
            font-weight: 600;
            position: relative;
            z-index: 3;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: row-reverse;
            position: relative;
            z-index: 2;
        }

        .left {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar {
            height: 200px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .side-box h3 {
            font-size: 18px;
            margin-bottom: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #444;
            font-weight: 600;
        }

        .side-box p {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 10px;
            color: #555;
        }

        .main {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .main h2 {
            font-size: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            padding-left: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            font-weight: 600;
            user-select: none;
        }

        .main h2:hover, .main h2.active {
            border-left-color: #764ba2;
            color: #667eea;
            padding-left: 18px;
        }

        .book-content {
            display: none;
            padding: 10px 0 40px;
            margin-bottom: 30px;
            animation: openBook 0.4s ease;
            min-height: 400px; /* 固定最小高度，避免内容看不见 */
            background: rgba(255,255,255,0.4);
            border-radius: 8px;
        }

        @keyframes openBook {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

       /* 替换原来的.fish-timeline及以下所有鱼骨相关样式 */
.fish-timeline {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 30px 0 60px;
    z-index: 10;
}
/* 手绘鱼骨身：锯齿形+不规则抖动 */
.fish-body {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) rotate(0.5deg); /* 微微倾斜模拟手绘歪歪的感觉 */
    width: 16px;
    height: 100%;
    background: repeating-linear-gradient(
        180deg,
        #165DFF 0px,
        #165DFF 18px,
        transparent 18px,
        transparent 28px
    );
    filter: url(#rough-edge); /* 加毛边效果，下面会加svg滤镜 */
    z-index: 11;
}
/* 手绘鱼头：带表情+圆角 */
.fish-head {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%) rotate(-1deg);
    width: 60px;
    height: 70px;
    background: #165DFF;
    border-radius: 50% 50% 40% 40%;
    z-index: 11;
    filter: url(#rough-edge);
}
/* 鱼头眼睛 */
.fish-head::before {
    content: "";
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
}
/* 鱼头微笑 */
.fish-head::after {
    content: "";
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 8px;
    border-bottom: 2px solid white;
    border-radius: 0 0 10px 10px;
}
/* 手绘鱼尾 */
.fish-tail {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%) rotate(1deg);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 45px solid #165DFF;
    z-index: 11;
    filter: url(#rough-edge);
}
/* 删掉原来的.fish-tail span相关样式，不需要了 */
.fish-tail span {
    display: none;
}

.fish-item {
    position: relative;
    margin: 32px 0;
    width: 50%;
    font-size: 15px;
    line-height: 1.6;
    z-index: 12;
    font-family: "Marker Felt", "手写体", "Microsoft YaHei", sans-serif; /* 换成手写字体更像 */
}

        /* 蓝白色雪花样式 */
        .snowflake {
            position: absolute;
            background: linear-gradient(135deg, #ffffff, #b3d9ff, #99ccff);
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(102, 170, 255, 0.7);
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* 雪花飘动动画，带水平偏移 */
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0) rotate(0deg); }
            100% { transform: translateY(100vh) translateX(var(--x-offset, 0)) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
            .left { width: 100%; }
            .fish-item { width: 100% !important; text-align: left !important; padding: 0 0 0 30px !important; left: 0 !important; }
            .fish-item::after { display: none; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute;">
        <filter id="rough-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
        </filter>
    </svg>
    
    <!-- 全局雪花容器 -->
    <div class="snow" id="snow"></div>
    
    <header>
        <!-- 标题栏内部雪花容器 -->
        <div class="snow-inner" id="headerSnow"></div>
        <h1>❄️ 雪人的世界 ❄️</h1>
    </header>

    <div class="container">
        <div class="left">
            <div class="avatar">
                <!-- 图片加载失败兜底 -->
                <img src="Passport.jpg" alt="头像" onerror="this.src='https://picsum.photos/200/200?random=1'">
            </div>
            <div class="side-box">
                <h3>🌟 关于我</h3>
                <p>喜欢安静也喜欢热闹</p>
                <p>不显眼的二刺猿</p>
                <p>加载中...</p>
                <p>热爱一切美好</p>
            </div>
        </div>

        <div class="main">
            <h2 onclick="toggleBook(this)">✨ 我的爱好</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>📖</strong><br>喜欢在xhs里找安静</div>
                    <div class="fish-item timeline-right"><strong>🎵</strong><br>爱上演唱会的氛围</div>
                    <div class="fish-item timeline-left"><strong>🌙</strong><br>喜欢就要得到</div>
                    <div class="fish-item timeline-right"><strong>✍️</strong><br>几乎每天都发发微博</div>
                    <div class="fish-item timeline-left"><strong>☁️</strong><br>对特定的事物毫无关心</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📦 我的收藏</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>🐱</strong><br>云养喵喵和汪总</div>
                    <div class="fish-item timeline-right"><strong>🖼️</strong><br>截图里藏着的温柔瞬间</div>
                    <div class="fish-item timeline-left"><strong>📷</strong><br>拍拍拍记录每一瞬间</div>
                    <div class="fish-item timeline-right"><strong>🎁</strong><br>这是我的大小物分享</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📝 5月小记</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>🌤️</strong><br>每日一拍</div>
                    <div class="fish-item timeline-right"><strong>🎶</strong><br>今日推荐歌曲</div>
                    <div class="fish-item timeline-left"><strong>📜</strong><br>感触的文字</div>
                    <div class="fish-item timeline-right"><strong>🧘</strong><br>今日热词</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">😊 我的小心情</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>早上</strong><br>一上班就两眼空空</div>
                    <div class="fish-item timeline-right"><strong>中午</strong><br>饿到晕厥</div>
                    <div class="fish-item timeline-left"><strong>晚上</strong><br>不可多得的休闲时光</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 雪花生成函数
        function createSnow(containerId, count, isHeader = false) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < count; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                
                // 随机大小
                const size = isHeader ? Math.random() * 4 + 1 : Math.random() * 6 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                
                // 随机位置
                snowflake.style.left = `${Math.random() * 100}%`;
                
                // 随机透明度
                snowflake.style.opacity = Math.random() * 0.3 + 0.6;

                // 随机水平偏移，模拟雪花飘动效果
                const xOffset = (Math.random() - 0.5) * (isHeader ? 50 : 120);
                snowflake.style.setProperty('--x-offset', `${xOffset}px`);
                
                // 随机下落速度
                const duration = isHeader ? Math.random() * 8 + 5 : Math.random() * 10 + 8;
                snowflake.style.animationDuration = `${duration}s`;
                
                // 随机延迟
                snowflake.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(snowflake);
            }
        }

        // 页面加载完成后执行
        window.onload = function() {
            // 生成雪花：全局50片，标题栏20片
            createSnow('snow', 50);
            createSnow('headerSnow', 20, true);
            // 默认展开第一个板块，加点击高亮状态
            const firstTitle = document.querySelector('.main h2');
            const firstContent = firstTitle.nextElementSibling;
            firstTitle.classList.add('active');
            firstContent.style.display = 'block';
        };

        // 折叠面板交互函数
        function toggleBook(element) {
            const content = element.nextElementSibling;
            const isShow = content.style.display === 'block';
            // 切换显示状态
            content.style.display = isShow ? 'none' : 'block';
            // 切换点击高亮状态
            element.classList.toggle('active', !isShow);
        }
    </script>
</body>
</html>
