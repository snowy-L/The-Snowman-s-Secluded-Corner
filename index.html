<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪人的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: url("bg.png") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            /* 提升背景清晰度：降低遮罩透明度 */
            background-color: #f0f7ff;
            color: #333;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 全局雪花动画容器 */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255, 0.02);
            z-index: -1;
        }

        /* 标题框雪花背景 + 样式优化 */
        header {
            background: rgba(255, 255, 255, 0.85);
            padding: 26px;
            text-align: center;
            margin-bottom: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        /* 标题框内部雪花动画 */
        header .snow-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        header h1 {
            font-size: 28px;
            color: #222;
            font-weight: 600;
            position: relative;
            z-index: 3;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: row-reverse;
        }

        .left {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar {
            height: 200px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .side-box h3 {
            font-size: 18px;
            margin-bottom: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #444;
            font-weight: 600;
        }

        .side-box p {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 10px;
            color: #555;
        }

        .main {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .main h2 {
            font-size: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            padding-left: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            font-weight: 600;
        }

        .main h2:hover {
            border-left-color: #764ba2;
            color: #667eea;
            padding-left: 18px;
        }

        .book-content {
            display: none;
            padding: 10px 0 40px;
            margin-bottom: 30px;
            animation: openBook 0.4s ease;
        }

        @keyframes openBook {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fish-timeline {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 0 50px;
        }

        .fish-body {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 100%;
            background: repeating-linear-gradient(
                180deg,
                #1a73b9 0px,
                #1a73b9 10px,
                transparent 10px,
                transparent 20px
            );
            border-radius: 3px;
        }

        .fish-head {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid #1a73b9;
        }

        .fish-head::after {
            content: "";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        .fish-tail {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 60px;
            background: transparent;
        }

        .fish-tail span {
            position: absolute;
            left: 50%;
            width: 2px;
            height: 30px;
            background: #1a73b9;
            transform-origin: top center;
        }

        .fish-tail span:nth-child(1) { transform: translateX(-50%) rotate(-30deg); }
        .fish-tail span:nth-child(2) { transform: translateX(-50%) rotate(-15deg); }
        .fish-tail span:nth-child(3) { transform: translateX(-50%) rotate(0deg); }
        .fish-tail span:nth-child(4) { transform: translateX(-50%) rotate(15deg); }
        .fish-tail span:nth-child(5) { transform: translateX(-50%) rotate(30deg); }

        .fish-item {
            position: relative;
            margin: 28px 0;
            width: 50%;
            font-size: 14px;
            line-height: 1.5;
        }

        .fish-item.left {
            left: 0;
            padding-right: 25px;
            text-align: right;
        }

        .fish-item.right {
            left: 50%;
            padding-left: 25px;
        }

        .fish-item::after {
            content: "→";
            position: absolute;
            top: 5px;
            color: #333;
            font-weight: bold;
        }

        .fish-item.left::after {
            right: 5px;
            transform: scaleX(-1);
        }

        .fish-item.right::after {
            left: 5px;
        }

        /* 雪花动画样式 */
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
            .left { width: 100%; }
            .fish-item { width: 100%; text-align: left; padding: 0 10px; }
            .fish-item.left, .fish-item.right { left: 0; padding: 0; text-align: left; }
            .fish-item::after { display: none; }
        }
    </style>
</head>

<body>
    <!-- 全局雪花 -->
    <div class="snow" id="snow"></div>
    
    <header>
        <!-- 标题框内部雪花 -->
        <div class="snow-inner" id="headerSnow"></div>
        <h1>❄️ 雪人的世界 ❄️</h1>
    </header>

    <div class="container">
        <div class="left">
            <div class="avatar">
                <img src="Passport.jpg" alt="头像">
            </div>
            <div class="side-box">
                <h3>🌟 关于我</h3>
                <p>喜欢安静也喜欢热闹</p>
                <p>不显眼的二刺猿</p>
                <p>加载中...</p>
                <p>热爱一切美好</p>
            </div>
        </div>

        <div class="main">
            <h2 onclick="toggleBook(this)">✨ 我的爱好</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item left"><strong>📖</strong><br>喜欢在xhs里找安静</div>
                    <div class="fish-item right"><strong>🎵</strong><br>爱上演唱会的氛围</div>
                    <div class="fish-item left"><strong>🌙</strong><br>喜欢就要得到</div>
                    <div class="fish-item right"><strong>✍️</strong><br>几乎每天都发发微博</div>
                    <div class="fish-item left"><strong>☁️</strong><br>对特定的事物毫无关心</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📦 我的收藏</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item left"><strong>🐱</strong><br>云养喵喵和汪总</div>
                    <div class="fish-item right"><strong>🖼️</strong><br>截图里藏着的温柔瞬间</div>
                    <div class="fish-item left"><strong>📷</strong><br>拍拍拍记录每一瞬间</div>
                    <div class="fish-item right"><strong>🎁</strong><br>这是我的大小物分享</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📝 5月小记</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item left"><strong>🌤️</strong><br>每日一拍</div>
                    <div class="fish-item right"><strong>🎶</strong><br>今日推荐歌曲</div>
                    <div class="fish-item left"><strong>📜</strong><br>感触的文字</div>
                    <div class="fish-item right"><strong>🧘</strong><br>今日热词</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">😊 我的小心情</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item left"><strong>早上</strong><br>一上班就两眼空空</div>
                    <div class="fish-item right"><strong>中午</strong><br>饿到晕厥</div>
                    <div class="fish-item left"><strong>晚上</strong><br>不可多得的休闲时光</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 雪花生成函数
        function createSnow(containerId, count, isHeader = false) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < count; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                
                // 随机大小
                const size = isHeader ? Math.random() * 4 + 1 : Math.random() * 6 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                
                // 随机位置
                snowflake.style.left = `${Math.random() * 100}%`;
                
                // 随机下落速度
                const duration = isHeader ? Math.random() * 8 + 5 : Math.random() * 10 + 8;
                snowflake.style.animationDuration = `${duration}s`;
                
                // 随机延迟
                snowflake.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(snowflake);
            }
        }

        // 生成雪花：页面全局50片，标题框20片
        window.onload = function() {
            createSnow('snow', 50);
            createSnow('headerSnow', 20, true);
        };

        // 原有折叠功能
        function toggleBook(element) {
            var content = element.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
