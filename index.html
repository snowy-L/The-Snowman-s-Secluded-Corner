<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪人的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #fdfdfd;
            color: #333;
            padding: 20px;
        }

        /* 顶部标题 */
        header {
            border: 1px solid #555;
            padding: 26px;
            text-align: center;
            margin-bottom: 24px;
            background: #f7f9fc;
        }

        header h1 {
            font-size: 24px;
            color: #222;
        }

        /* 布局：左 + 右 */
        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 左侧 */
        .left {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 左侧头像框 */
        .avatar {
            height: 180px;
            border: 1px solid #555;
            background: #f7f9fc;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 左侧下方长框 */
        .side-box {
            flex: 1;
            border: 1px solid #555;
            padding: 20px;
            background: #f7f9fc;
        }

        .side-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }

        .side-box p {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 8px;
        }

        /* 右侧主内容 */
        .main {
            flex: 1;
            border: 1px solid #555;
            padding: 30px;
            background: #ffffff;
        }

        .main h2 {
            font-size: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #777;
            padding-left: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .main h2:hover {
            color: #559;
            padding-left: 14px;
        }

        .main p {
            line-height: 1.8;
            margin-bottom: 14px;
            font-size: 15px;
        }

        /* 翻书展开动画 */
        .book-content {
            display: none;
            padding-left: 10px;
            margin-bottom: 20px;
            animation: openBook 0.4s ease;
        }

        @keyframes openBook {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>雪人的世界</h1>
    </header>

    <div class="container">
        <div class="left">
            <!-- 插入 Passport.jpg 头像 -->
            <div class="avatar">
                <img src="Passport.jpg" alt="头像">
            </div>

            <!-- 左侧长框：我的小标签 -->
            <div class="side-box">
                <h3>关于我</h3>
                <p>喜欢安静</p>
                <p>热爱收集美好</p>
                <p>记录生活碎片</p>
                <p>忠于自己的小世界</p>
            </div>
        </div>

        <!-- 右侧主内容 -->
        <div class="main">

            <h2 onclick="toggleBook(this)">✨ 我的爱好</h2>
            <div class="book-content">
                <p>📖 看书</p>
                <p>🎵 听音乐</p>
                <p>🎁 收集喜欢的事物</p>
                <p>✍️ 记录生活</p>
                <p>☁️ 发呆、感受温柔的小事</p>
            </div>

            <h2 onclick="toggleBook(this)">📦 我的收藏</h2>
            <div class="book-content">
                <p>收藏句子、收藏画面、收藏回忆</p>
                <p>收藏一切让我觉得温暖与治愈的东西</p>
            </div>

            <h2 onclick="toggleBook(this)">📝 值得记录的小事</h2>
            <div class="book-content">
                <p>风很舒服的傍晚。</p>
                <p>听到一首很喜欢的歌。</p>
                <p>看到一段触动内心的文字。</p>
                <p>安静地、认真地、为自己活一小会儿。</p>
            </div>

            <h2 onclick="toggleBook(this)">🌙 我的小心情</h2>
            <div class="book-content">
                <p>慢慢走，不必急。</p>
                <p>认真生活，忠于自己。</p>
                <p>在自己的小世界里，安静而闪亮。</p>
            </div>

        </div>
    </div>

    <script>
        // 翻书展开/收起效果
        function toggleBook(element) {
            var content = element.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
        }
    </script>

</body>
</html>
