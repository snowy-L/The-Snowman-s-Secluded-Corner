<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪人的世界</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(180deg, #f0f7ff, #e6f2ff) url("bg.png") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #f0f7ff;
            color: #333;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 全局雪花动画容器 */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    /* 背景图100%完全显示，不重复、占满全屏、滚动时固定不动 */
    background: #f0f7ff url("bg.png") no-repeat center center fixed;
    background-size: cover;
        }

        /* 标题框样式 */
        header {
            background: rgba(255, 255, 255, 0.85);
            padding: 26px;
            text-align: center;
            margin-bottom: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        /* 标题框内部雪花 */
        header .snow-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        header h1 {
            font-size: 28px;
            color: #222;
            font-weight: 600;
            position: relative;
            z-index: 3;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: row-reverse;
            position: relative;
            z-index: 2;
        }

        .left {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar {
            height: 200px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .side-box h3 {
            font-size: 18px;
            margin-bottom: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #444;
            font-weight: 600;
        }

        .side-box p {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 10px;
            color: #555;
        }

        .main {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .main h2 {
            font-size: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            padding-left: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            font-weight: 600;
            user-select: none;
        }

        .main h2:hover, .main h2.active {
            border-left-color: #764ba2;
            color: #667eea;
            padding-left: 18px;
        }

    .book-content {
    display: none;
    padding: 10px 0 40px;
    margin-bottom: 30px;
    animation: openBook 0.4s ease;
    min-height: 400px;
    /* 把半透背景改成纯白/和你鱼骨底色一致的颜色，白边完全消失 */
    background: #ffffff;
    border-radius: 8px;
    }

        @keyframes openBook {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

  /* 替换所有鱼骨相关CSS ↓ */
.fish-timeline {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 10px 80px;
    z-index: 10;
    min-height: 580px;
    /* 先把文件名空格改成下划线/横杠，避免路径识别错误：把hand fish.png改成hand_fish.png */
    background: url("hand_fish.png") no-repeat center top;
    background-size: auto 100%;
    /* 核心：消白边+背景融合 */
    mix-blend-mode: multiply; /* 白色部分自动融入下层背景，蓝色鱼骨完全保留 */
    filter: contrast(1.1) brightness(1.05); /* 蓝色更饱和，压掉淡白边，要更自然可以加个0.2px微模糊：blur(0.2px) */
    background-color: transparent;
}

/* 隐藏原有CSS生成的鱼骨 */
.fish-head, .fish-body, .fish-tail {
    display: none !important;
}

.fish-item {
    position: relative;
    margin: 36px 0;
    width: 45%;
    font-size: 15px;
    line-height: 1.6;
    z-index: 12;
    font-family: "ZCOOL KuaiLe", "Ma Shan Zheng", "Marker Felt", sans-serif;
    /* 文字不受混合模式影响，单独设置 */
    mix-blend-mode: normal;
}

.fish-item.timeline-left {
    left: 0;
    padding-right: 10px;
    text-align: right;
}

.fish-item.timeline-right {
    left: 55%;
    padding-left: 10px;
}

.fish-item::after {
    content: "➤";
    position: absolute;
    top: 6px;
    color: #165DFF;
    font-weight: bold;
    font-size: 14px;
    mix-blend-mode: normal;
}

.fish-item.timeline-left::after {
    right: -16px;
    transform: scaleX(-1);
}

.fish-item.timeline-right::after {
    left: -16px;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .container { flex-direction: column-reverse; }
    .left { width: 100%; }
    .fish-timeline {
        background-size: 60% auto;
        background-position: 80% top;
        min-height: auto;
    }
    .fish-item {
        width: 100% !important;
        left: 0 !important;
        text-align: left !important;
        padding: 0 0 0 40px !important;
        margin: 28px 0 !important;
    }
    .fish-item::after {
        left: 10px !important;
        transform: none !important;
    }
}

/* 移动端适配 */
@media (max-width: 768px) {
    .fish-timeline {
        background-size: 60% auto;
        background-position: 80% top;
        min-height: auto;
    }
    .fish-item {
        width: 100% !important;
        left: 0 !important;
        text-align: left !important;
        padding: 0 0 0 40px !important;
        margin: 28px 0 !important;
    }
    .fish-item::after {
        left: 10px !important;
        transform: none !important;
    }
}

        /* 蓝白色雪花样式 */
        .snowflake {
            position: absolute;
            background: linear-gradient(135deg, #ffffff, #b3d9ff, #99ccff);
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(102, 170, 255, 0.7);
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* 雪花飘动动画，带水平偏移 */
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0) rotate(0deg); }
            100% { transform: translateY(100vh) translateX(var(--x-offset, 0)) rotate(360deg); }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute;">
        <filter id="rough-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
        </filter>
    </svg>
    
    <!-- 全局雪花容器 -->
    <div class="snow" id="snow"></div>
    
    <header>
        <!-- 标题栏内部雪花容器 -->
        <div class="snow-inner" id="headerSnow"></div>
        <h1>❄️ 雪人的世界 ❄️</h1>
    </header>

    <div class="container">
        <div class="left">
            <div class="avatar">
                <!-- 图片加载失败兜底 -->
                <img src="Passport.jpg" alt="头像" onerror="this.src='https://picsum.photos/200/200?random=1'">
            </div>
            <div class="side-box">
                <h3>🌟 关于我</h3>
                <p>喜欢安静也喜欢热闹</p>
                <p>不显眼的二刺猿</p>
                <p>加载中...</p>
                <p>热爱一切美好</p>
            </div>
        </div>

        <div class="main">
            <h2 onclick="toggleBook(this)">✨ 我的爱好</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>📖</strong><br>喜欢在xhs里找安静</div>
                    <div class="fish-item timeline-right"><strong>🎵</strong><br>爱上演唱会的氛围</div>
                    <div class="fish-item timeline-left"><strong>🌙</strong><br>喜欢就要得到</div>
                    <div class="fish-item timeline-right"><strong>✍️</strong><br>几乎每天都发发微博</div>
                    <div class="fish-item timeline-left"><strong>☁️</strong><br>对特定的事物毫无关心</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📦 我的收藏</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>🐱</strong><br>云养喵喵和汪总</div>
                    <div class="fish-item timeline-right"><strong>🖼️</strong><br>截图里藏着的温柔瞬间</div>
                    <div class="fish-item timeline-left"><strong>📷</strong><br>拍拍拍记录每一瞬间</div>
                    <div class="fish-item timeline-right"><strong>🎁</strong><br>这是我的大小物分享</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📝 5月小记</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>🌤️</strong><br>每日一拍</div>
                    <div class="fish-item timeline-right"><strong>🎶</strong><br>今日推荐歌曲</div>
                    <div class="fish-item timeline-left"><strong>📜</strong><br>感触的文字</div>
                    <div class="fish-item timeline-right"><strong>🧘</strong><br>今日热词</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">😊 我的小心情</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body"></div>
                    <div class="fish-tail"><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="fish-item timeline-left"><strong>早上</strong><br>一上班就两眼空空</div>
                    <div class="fish-item timeline-right"><strong>中午</strong><br>饿到晕厥</div>
                    <div class="fish-item timeline-left"><strong>晚上</strong><br>不可多得的休闲时光</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 雪花生成函数
        function createSnow(containerId, count, isHeader = false) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < count; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                
                // 随机大小
                const size = isHeader ? Math.random() * 4 + 1 : Math.random() * 6 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                
                // 随机位置
                snowflake.style.left = `${Math.random() * 100}%`;
                
                // 随机透明度
                snowflake.style.opacity = Math.random() * 0.3 + 0.6;

                // 随机水平偏移，模拟雪花飘动效果
                const xOffset = (Math.random() - 0.5) * (isHeader ? 50 : 120);
                snowflake.style.setProperty('--x-offset', `${xOffset}px`);
                
                // 随机下落速度
                const duration = isHeader ? Math.random() * 8 + 5 : Math.random() * 10 + 8;
                snowflake.style.animationDuration = `${duration}s`;
                
                // 随机延迟
                snowflake.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(snowflake);
            }
        }

        // 页面加载完成后执行
        window.onload = function() {
            // 生成雪花：全局50片，标题栏20片
            createSnow('snow', 50);
            createSnow('headerSnow', 20, true);
            // 默认展开第一个板块，加点击高亮状态
            const firstTitle = document.querySelector('.main h2');
            const firstContent = firstTitle.nextElementSibling;
            firstTitle.classList.add('active');
            firstContent.style.display = 'block';
        };

        // 折叠面板交互函数
        function toggleBook(element) {
            const content = element.nextElementSibling;
            const isShow = content.style.display === 'block';
            // 切换显示状态
            content.style.display = isShow ? 'none' : 'block';
            // 切换点击高亮状态
            element.classList.toggle('active', !isShow);
        }
    </script>
</body>
</html>
