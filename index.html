<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪人的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #fafbfc;
            color: #333;
            padding: 20px;
        }

        header {
            background: #ffffff;
            padding: 26px;
            text-align: center;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        header h1 {
            font-size: 24px;
            color: #222;
            font-weight: normal;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: row-reverse;
        }

        .left {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar {
            height: 180px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-box {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .side-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
            color: #444;
        }

        .side-box p {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 8px;
            color: #555;
        }

        .main {
            flex: 1;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .main h2 {
            font-size: 18px;
            margin-bottom: 30px;
            border-left: 4px solid #aaa;
            padding-left: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
        }

        .main h2:hover {
            border-left-color: #669;
            color: #445;
            padding-left: 14px;
        }

        .book-content {
            display: none;
            padding: 10px 0 60px;
            margin-bottom: 30px;
            animation: openBook 0.4s ease;
        }

        @keyframes openBook {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ✅ 方块节点鱼骨时间线（参考你给的截图样式） */
        .fish-timeline {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px 0 50px;
        }

        /* 鱼身：方块节点 */
        .fish-body {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 420px;
        }

        .fish-body .block {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: #1a73b9;
        }

        /* 鱼头 */
        .fish-head {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid #1a73b9;
        }

        .fish-head::after {
            content: "";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        /* 镂空扫把鱼尾 */
        .fish-tail {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 60px;
            background: transparent;
        }

        .fish-tail span {
            position: absolute;
            left: 50%;
            width: 2px;
            height: 30px;
            background: #1a73b9;
            transform-origin: top center;
        }

        .fish-tail span:nth-child(1) { transform: translateX(-50%) rotate(-30deg); }
        .fish-tail span:nth-child(2) { transform: translateX(-50%) rotate(-15deg); }
        .fish-tail span:nth-child(3) { transform: translateX(-50%) rotate(0deg); }
        .fish-tail span:nth-child(4) { transform: translateX(-50%) rotate(15deg); }
        .fish-tail span:nth-child(5) { transform: translateX(-50%) rotate(30deg); }

        /* 时间线节点 */
        .fish-item {
            position: relative;
            margin: 55px 0;
            width: 50%;
            font-size: 14px;
            line-height: 1.6;
        }

        .fish-item.left {
            left: 0;
            padding-right: 30px;
            text-align: right;
        }

        .fish-item.right {
            left: 50%;
            padding-left: 30px;
        }

        /* 箭头 */
        .fish-item::after {
            content: "→";
            position: absolute;
            top: 5px;
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }

        .fish-item.left::after {
            right: 5px;
            transform: scaleX(-1);
        }

        .fish-item.right::after {
            left: 5px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
            .left { width: 100%; }
            .fish-item { width: 100%; text-align: left; padding: 0 10px; }
            .fish-item.left, .fish-item.right { left: 0; padding: 0; text-align: left; }
            .fish-item::after { display: none; }
        }
    </style>
</head>

<body>
    <header>
        <h1>雪人的世界</h1>
    </header>

    <div class="container">
        <div class="left">
            <div class="avatar">
                <img src="Passport.jpg" alt="头像">
            </div>
            <div class="side-box">
                <h3>我?</h3>
                <p>喜欢安静也喜欢热闹</p>
                <p>不显眼的二刺猿</p>
                <p>加载中...</p>
                <p>热爱一切美好</p>

        </div>

        <div class="main">
            <h2 onclick="toggleBook(this)">✨ 我的爱好</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body">
                        <div class="block" style="top: 20px;"></div>
                        <div class="block" style="top: 90px;"></div>
                        <div class="block" style="top: 160px;"></div>
                        <div class="block" style="top: 230px;"></div>
                        <div class="block" style="top: 300px;"></div>
                    </div>
                    <div class="fish-tail">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="fish-item left"><strong>📖</strong><br>喜欢在xhs里找安静</div>
                    <div class="fish-item right"><strong>🎵</strong><br>爱上演唱会的氛围</div>
                    <div class="fish-item left"><strong>🌙</strong><br>喜欢就要得到</div>
                    <div class="fish-item right"><strong>✍️</strong><br>几乎每天都发发微博</div>
                    <div class="fish-item left"><strong>☁️</strong><br>对特定的事物毫无关心</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📦 我的收藏</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body">
                        <div class="block" style="top: 20px;"></div>
                        <div class="block" style="top: 90px;"></div>
                        <div class="block" style="top: 160px;"></div>
                        <div class="block" style="top: 230px;"></div>
                    </div>
                    <div class="fish-tail">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="fish-item left"><strong>🐱</strong><br>云养喵喵和汪总</div>
                    <div class="fish-item right"><strong>🖼️</strong><br>截图里藏着的温柔瞬间</div>
                    <div class="fish-item left"><strong>📷</strong><br>拍拍拍记录每一瞬间</div>
                    <div class="fish-item right"><strong>🎁</strong><br>这是我的大小物分享</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">📝 5月小记</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body">
                        <div class="block" style="top: 20px;"></div>
                        <div class="block" style="top: 90px;"></div>
                        <div class="block" style="top: 160px;"></div>
                        <div class="block" style="top: 230px;"></div>
                    </div>
                    <div class="fish-tail">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="fish-item left"><strong>🌤️</strong><br>每日一拍</div>
                    <div class="fish-item right"><strong>🎶</strong><br>今日推荐歌曲</div>
                    <div class="fish-item left"><strong>📜</strong><br>感触的文字</div>
                    <div class="fish-item right"><strong>🧘</strong><br>今日热词</div>
                </div>
            </div>

            <h2 onclick="toggleBook(this)">😊 我的小心情</h2>
            <div class="book-content">
                <div class="fish-timeline">
                    <div class="fish-head"></div>
                    <div class="fish-body">
                        <div class="block" style="top: 20px;"></div>
                        <div class="block" style="top: 90px;"></div>
                        <div class="block" style="top: 160px;"></div>
                    </div>
                    <div class="fish-tail">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="fish-item left"><strong>早上</strong><br>一上班就两眼空空</div>
                    <div class="fish-item right"><strong>中午</strong><br>饿到晕厥</div>
                    <div class="fish-item left"><strong>晚上</strong><br>不可多得的休闲时光</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleBook(element) {
            var content = element.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
